[project]
name = "metrics-consumer"
version = "0.1.0"
description = "FastAPI Kafka consumer for Metrics order events"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.10,<3",
    "aiokafka[snappy]>=0.12,<1",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.18,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "anyio>=4,<5", "httpx>=0.28,<1", "ruff>=0.17,<1", "aiosqlite>=0.21,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
